name: Build and Deploy FE Docker Image

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/elearn-fe:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/elearn-fe:${{ github.sha }}
          build-args: |
            NEXTAUTH_BASEPATH=${{ secrets.NEXTAUTH_BASEPATH }}
            AUTH_API_URL=${{ secrets.AUTH_API_URL }}
            ASSIGNMENT_API_URL=${{ secrets.ASSIGNMENT_API_URL }}
            CLASS_API_URL=${{ secrets.CLASS_API_URL }}
            EXAM_API_URL=${{ secrets.EXAM_API_URL }}
            NEXT_PUBLIC_AUTH_API_URL=${{ secrets.AUTH_API_URL }}
            NEXT_PUBLIC_ASSIGNMENT_API_URL=${{ secrets.ASSIGNMENT_API_URL }}
            NEXT_PUBLIC_CLASS_API_URL=${{ secrets.CLASS_API_URL }}
            NEXT_PUBLIC_EXAM_API_URL=${{ secrets.EXAM_API_URL }}
